conformsTo: adk:ProjectionAsset/1.0
id: asset://adk.example/host.auth/primitive/VerifyCredential/1.0
name: VerifyCredential
assetKind: primitive
conformsToKind: host.auth
version: 1.0.0
propSchema:
  type: object
  properties:
    verifier:
      type: string
      enum: [self-issue, external]
    externalRef: {}
    safetyEnv:
      type: object
      properties:
        allowInProduction: { type: boolean }
  required: [verifier]
contract: "declare how the extracted carrier becomes a verified or rejected auth attempt."
render:
  op: match
  scrutinee: { op: get, path: "$input/props/verifier" }
  cases:
    - pattern: { kind: const, value: self-issue }
      body:
        op: if
        cond:
          op: call
          fn: or
          args:
            - op: call
              fn: or
              args:
                - op: call
                  fn: neq
                  args:
                    - { op: get, path: "$env/NODE_ENV" }
                    - { op: const, value: production }
                - op: call
                  fn: eq
                  args:
                    - { op: get, path: "$env/ADK_ALLOW_TEST_AUTH" }
                    - { op: const, value: "1" }
            - { op: get, path: "$input/props/safetyEnv/allowInProduction" }
        then:
          op: record
          fields:
            kind: { op: const, value: verified }
            user: { op: get, path: "$input/challenge/extracted/user" }
            caps: { op: get, path: "$input/challenge/extracted/caps" }
        else:
          op: record
          fields:
            kind: { op: const, value: rejected }
            reason: { op: const, value: "test-auth disabled in production" }
    - pattern: { kind: const, value: external }
      body:
        op: record
        fields:
          kind: { op: const, value: rejected }
          reason: { op: const, value: "external verifier not wired" }
