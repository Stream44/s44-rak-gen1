      properties:
        value: {}
        context: { type: object }
        handlers: { type: array }
        pageBindings: { type: object }
        session: { type: object }
  MaterializeProjectionNodeInput:
    name: MaterializeProjectionNodeInput
    jsonSchema:
      type: object
      required: [node, context, handlers, uiContextState]
      properties:
        node: { type: object }
