  ui.html.ws:
    kindPath: ./L08-kinds/ui-html-ws/
  api.rest:
    kindPath: ./L08-kinds/api-rest/
  cli.stdout:
    kindPath: ./L08-kinds/cli-stdout/
  host.api:
