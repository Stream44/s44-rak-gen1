machines:
  EchoLifecycle:
    id: EchoLifecycle
    name: Echo Lifecycle
    stateType: type://adk/EchoState/0.1.0
    eventType: type://adk/EchoEvent/0.1.0
    initialState: { status: pending }
    transitions:
      - from:
          kind: record
          fields:
            status: { kind: const, value: pending }
        event:
          kind: record
          fields:
            verb: { kind: const, value: echo }
        to:
          op: record
          fields:
            status: { op: const, value: echoed }
  DispatchLifecycle:
    id: DispatchLifecycle
    name: Projection Kernel Dispatch Lifecycle
    stateType: type://adk/DispatchLifecycleState/0.1.0
    eventType: type://adk/DispatchLifecycleEvent/0.1.0
    initialState: { status: pending }
    transitions:
      - from: { kind: record, fields: { status: { kind: const, value: pending } } }
        event: { kind: record, fields: { verb: { kind: const, value: resolveRef } } }
        to: { op: const, value: { status: resolved } }
      - from: { kind: record, fields: { status: { kind: const, value: resolved } } }
        event: { kind: record, fields: { verb: { kind: const, value: authorize } } }
        to: { op: const, value: { status: authorized } }
      - from: { kind: record, fields: { status: { kind: const, value: authorized } } }
        event: { kind: record, fields: { verb: { kind: const, value: submit } } }
        to: { op: const, value: { status: submitted } }
      - from: { kind: record, fields: { status: { kind: const, value: submitted } } }
        event: { kind: record, fields: { verb: { kind: const, value: encode } } }
        to: { op: const, value: { status: complete } }

morphisms:
  # computeModulePreload defaults to every module-backed morphism URI in the model.
  computeModulePreload:
    id: computeModulePreload
    input: type://adk/KernelModelDocument/0.1.0
    output: type://adk/ModulePreloadList/0.1.0
    impl:
      kind: algebra
      ast:
        op: call
        fn: map
        args:
          - op: call
            fn: filter
            args:
              - op: call
                fn: values
                args:
                  - op: get
                    path: $input/morphisms
              - op: lambda
                param: $m
                body:
                  op: call
                  fn: eq
                  args:
                    - op: get
                      path: $m/impl/kind
                    - op: const
                      value: module
          - op: lambda
            param: $m
            body:
              op: get
              path: $m/impl/uri
    category: pure
  parseProjectionDoc:
    id: parseProjectionDoc
    input: type://adk/RawProjectionYaml/0.1.0
    output: type://adk/ProjectionModel/0.1.0
    impl:
      kind: module
      uri: module://./L11-projection/morphisms/parse-projection-doc.ts
      export: default
    category: pure
  resolveExtends:
    id: resolveExtends
    input: type://adk/ProjectionModel/0.1.0
    output: type://adk/ProjectionModel/0.1.0
    impl:
      kind: module
      uri: module://./L11-projection/morphisms/resolve-extends.ts
      export: default
    category: pure
  buildManifest:
    id: buildManifest
    input: type://adk/ProjectionModel/0.1.0
    output: type://adk/ActionManifest/0.1.0
    impl:
      kind: module
      uri: module://./L11-projection/morphisms/build-manifest.ts
      export: default
    category: pure
  walkAst:
    id: walkAst
    input: type://adk/ProjectionModel/0.1.0
    output: type://adk/WalkedTree/0.1.0
    impl:
      kind: module
      uri: module://./L11-projection/morphisms/walk-ast.ts
      export: default
    category: pure
  surveyDemand:
    id: surveyDemand
    input: type://adk/WalkedTree/0.1.0
    output: type://adk/WalkedTree/0.1.0
    impl:
      kind: module
      uri: module://./L11-projection/morphisms/survey-demand.ts
      export: default
    category: pure
  emitCompiled:
    id: emitCompiled
    input: type://adk/ProjectionModel/0.1.0
    output: type://adk/CompiledProjection/0.1.0
    impl:
      kind: module
      uri: module://./L11-projection/morphisms/emit-compiled.ts
      export: default
    category: pure
  upperCase:
    id: upperCase
    input: type://adk/EchoInput/0.1.0
    output: type://adk/EchoInput/0.1.0
    impl:
      kind: module
      uri: module://./L11-projection/morphisms/upper-case.ts
      export: default
    category: pure
  measure:
    id: measure
    input: type://adk/EchoInput/0.1.0
    output: type://adk/EchoOutput/0.1.0
    impl:
      kind: module
      uri: module://./L11-projection/morphisms/measure.ts
      export: default
    category: pure
