kernel: meta-projection-minimal
version: 0.1.0
conformsTo: adk:KernelMetamodel/1.0
origin: adk

types:
  RawProjectionYaml:
    name: RawProjectionYaml
    jsonSchema:
      type: object
      required: [yamlText]
      properties:
        yamlText: { type: string }
  ProjectionModel:
    name: ProjectionModel
    jsonSchema:
      type: object
      required: [projector, version]
      properties:
        projector: { type: string }
        version: { type: string }
        bindsModel: {}
        pages: { type: object }
        morphism: {}
        actions: { type: array }
  ProjectionModelInput:
    name: ProjectionModelInput
    jsonSchema:
      type: object
      properties: {}
      additionalProperties: true
  FlatCarrier:
    name: FlatCarrier
    jsonSchema:
      type: object
      required: [scope, nodePath]
      properties:
        scope:
          type: string
          enum: [projection, page, route, component, asset, binding, action]
        nodePath: { type: string }
        requires:
          type: array
          items: { type: string }
        requiresAny:
          type: array
          items: { type: string }
  FlatCarrierArray:
    name: FlatCarrierArray
    jsonSchema:
      type: array
      items:
        type: object
        required: [scope, nodePath]
        properties:
          scope:
            type: string
            enum: [projection, page, route, component, asset, binding, action]
          nodePath: { type: string }
          requires:
            type: array
            items: { type: string }
          requiresAny:
            type: array
            items: { type: string }
  CapabilityRequirement:
    name: CapabilityRequirement
    jsonSchema:
      type: object
      required: [scope, nodePath, caps, combinator]
      properties:
        scope:
          type: string
          enum: [projection, page, route, component, asset, binding, action]
        nodePath: { type: string }
        caps:
          type: array
          items: { type: string }
        combinator:
          type: string
          enum: [all, any]
  CapabilityRequirementArray:
    name: CapabilityRequirementArray
    jsonSchema:
      type: array
      items:
        type: object
        required: [scope, nodePath, caps, combinator]
        properties:
          scope:
            type: string
            enum: [projection, page, route, component, asset, binding, action]
          nodePath: { type: string }
          caps:
            type: array
            items: { type: string }
          combinator:
            type: string
            enum: [all, any]
  CapabilityRequirementConcatInput:
    name: CapabilityRequirementConcatInput
    jsonSchema:
      type: object
      required: [left, right]
      properties:
        left:
          type: array
          items:
            type: object
            required: [scope, nodePath, caps, combinator]
            properties:
              scope:
                type: string
                enum: [projection, page, route, component, asset, binding, action]
              nodePath: { type: string }
              caps:
                type: array
                items: { type: string }
              combinator:
                type: string
                enum: [all, any]
        right:
          type: array
          items:
            type: object
            required: [scope, nodePath, caps, combinator]
            properties:
              scope:
                type: string
                enum: [projection, page, route, component, asset, binding, action]
              nodePath: { type: string }
              caps:
                type: array
                items: { type: string }
              combinator:
                type: string
                enum: [all, any]
  ActionManifest:
    name: ActionManifest
    jsonSchema:
      type: object
      required: [byName, byUri]
      properties:
        byName: { type: object }
        byUri: { type: object }
  WalkedTree:
    name: WalkedTree
    jsonSchema:
      type: object
      required: [kind, entries]
      properties:
        kind: { type: string, enum: [pages, morphism] }
        entries: { type: array }
  CompiledProjection:
    name: CompiledProjection
    jsonSchema:
      type: object
      required: [cid, model, manifest, ast]
      properties:
        cid: { type: string }
        model: { type: object }
        manifest: { type: object }
        ast: { type: object }
        staticRequirements: { type: array }
        staticCapabilities: { type: array }
  RenderRequest:
    name: RenderRequest
    jsonSchema:
      type: object
      required: [doc, pageName]
      properties:
        doc: { type: object }
        pageName: { type: string }
        props: { type: object }
        bindings: {}
        session: { type: object }
  ProjectionTree:
    name: ProjectionTree
    jsonSchema:
      type: object
      required: [root, pageName]
      properties:
        root: { type: object }
        pageName: { type: string }
        actionHandlers: { type: array }
  ModulePreloadList:
    name: ModulePreloadList
    jsonSchema:
      type: array
      items: { type: string }
  EchoInput:
    name: EchoInput
    jsonSchema:
      type: object
      required: [msg]
      properties:
        msg: { type: string }
  EchoOutput:
    name: EchoOutput
    jsonSchema:
      type: object
      required: [msg, length]
      properties:
        msg: { type: string }
        length: { type: integer }
  EchoState:
    name: EchoState
    jsonSchema:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, echoed]
  EchoEvent:
    name: EchoEvent
    jsonSchema:
      type: object
      required: [verb]
      properties:
        verb:
          type: string
          enum: [echo]
  AuthorizeInput:
    name: AuthorizeInput
    jsonSchema:
      type: object
      required: [requires, session, scope, nodePath]
      properties:
        requires:
          type: array
          items: { type: string }
        requiresAny:
          type: array
          items: { type: string }
        session:
          type: object
          required: [currentUser]
          properties:
            currentUser:
              type: object
              required: [id, capabilities]
              properties:
                id: { type: string }
                capabilities:
                  type: object
                  additionalProperties: { type: string }
        scope:
          type: string
          enum: [projection, page, route, component, asset, binding, action]
        nodePath: { type: string }
  AuthorizeVerdict:
    name: AuthorizeVerdict
    jsonSchema:
      type: object
      properties:
        outcome: { type: string }
        reason: { type: string }
        missing:
          type: array
          items: { type: string }
        scope: { type: string }
        nodePath: { type: string }
      oneOf:
        - type: object
          required: [outcome]
          properties:
            outcome: { const: allow }
        - type: object
          required: [outcome, reason, missing, scope, nodePath]
          properties:
            outcome: { const: deny }
            reason: { type: string }
            missing:
              type: array
              items: { type: string }
            scope: { type: string }
            nodePath: { type: string }
  AcceptancePredicateEvaluationInput:
    name: AcceptancePredicateEvaluationInput
    jsonSchema:
      type: object
      required: [expression, context]
      properties:
        expression: { type: string }
        context:
          type: object
          additionalProperties: true
      additionalProperties: false
  AcceptancePredicateEvaluationOutput:
    name: AcceptancePredicateEvaluationOutput
    jsonSchema:
      type: object
      required: [passed]
      properties:
        passed: { type: boolean }
      additionalProperties: false
  AcceptanceTraceExtractionInput:
    name: AcceptanceTraceExtractionInput
    jsonSchema:
      type: object
      required: [rootStep]
      properties:
        rootStep:
          type: object
          additionalProperties: true
        budget:
          type: integer
          minimum: 1
      additionalProperties: false
  AcceptanceTraceArray:
    name: AcceptanceTraceArray
    jsonSchema:
      type: array
      items:
        type: object
        additionalProperties: true
  AcceptanceMacroResolutionInput:
    name: AcceptanceMacroResolutionInput
    jsonSchema:
      type: object
      required: [step]
      properties:
        step:
          type: object
          additionalProperties: true
        lastCreatedKey:
          type: [string, "null"]
      additionalProperties: false
  AcceptanceStep:
    name: AcceptanceStep
    jsonSchema:
      type: object
      properties: {}
      additionalProperties: true
  AcceptanceStateEqualsAssertionInput:
    name: AcceptanceStateEqualsAssertionInput
    jsonSchema:
      type: object
      required: [actual]
      properties:
        actual: {}
        expected: {}
      additionalProperties: false
  AcceptanceStateFieldMatchAssertionInput:
    name: AcceptanceStateFieldMatchAssertionInput
    jsonSchema:
      type: object
      required: [actual, fields]
      properties:
        actual: {}
        fields:
          type: object
          additionalProperties: true
      additionalProperties: false
  AcceptanceEventEmittedAssertionInput:
    name: AcceptanceEventEmittedAssertionInput
    jsonSchema:
      type: object
      required: [events, targetKey]
      properties:
        events:
          type: array
          items:
            type: object
            additionalProperties: true
        targetKey: { type: string }
        newStateFields:
          type: object
          additionalProperties: true
      additionalProperties: false
  AcceptanceAssertionResult:
    name: AcceptanceAssertionResult
    jsonSchema:
      type: object
      required: [kind, passed, expected, actual]
      properties:
        kind: { type: string }
        passed: { type: boolean }
        expected: { type: string }
        actual: { type: string }
      additionalProperties: false
  DispatchFrame:
    name: DispatchFrame
    jsonSchema:
      type: object
      required: [actionRef]
      properties:
        actionRef: { type: string }
        target: { type: string }
        payload: { type: object }
        capabilityId: { type: string }
  ResolvedAction:
    name: ResolvedAction
    jsonSchema:
      type: object
      required: [name, kind]
      properties:
        name: { type: string }
        kind: { type: string, enum: [model, custom, ephemeral] }
        action: { type: object }
        payloadSchema: { type: object }
        frame: { type: object }
  IntentResult:
    name: IntentResult
    jsonSchema:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
        error: { type: string }
        value: {}
  DispatchResult:
    name: DispatchResult
    jsonSchema:
      type: object
      required: [kind, success]
      properties:
        kind: { type: string, enum: [custom, ephemeral, model, error] }
        success: { type: boolean }
        intentResult: { type: object }
        error: { type: string }
        name: { type: string }
        payload: { type: object }
  DispatchLifecycleState:
    name: DispatchLifecycleState
    jsonSchema:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, resolved, authorized, submitted, complete, denied, failed]
  DispatchLifecycleEvent:
    name: DispatchLifecycleEvent
    jsonSchema:
      type: object
      required: [verb]
      properties:
