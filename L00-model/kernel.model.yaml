                          },
                        ]
                    - { op: const, value: 0 }
                - op: call
                  fn: gt
                  args:
                    - op: call
                      fn: length
                      args:
                        [
                          {
                            op: call,
                            fn: keys,
                            args: [{ op: get, path: $input/sessionResult/ephemeral }],
                          },
                        ]
                    - { op: const, value: 0 }
        body:
          op: match
          scrutinee:
            op: record
            fields:
              jwtValid: { op: get, path: $input/jwtResult/valid }
              hasSession: { op: var, name: $hasSession }
          cases:
            - pattern:
                {
                  kind: record,
                  fields:
                    {
                      jwtValid: { kind: const, value: true },
                      hasSession: { kind: const, value: false },
                    },
                }
              body:
                op: record
                fields:
                  source: { op: const, value: jwt }
                  caps: { op: get, path: $input/jwtResult/claims/caps }
                  capabilityScopes: { op: get, path: $input/jwtResult/claims/scopes }
                  jwtClaims: { op: get, path: $input/jwtResult/claims }
            - pattern:
                {
                  kind: record,
                  fields:
                    {
                      jwtValid: { kind: const, value: true },
                      hasSession: { kind: const, value: true },
                    },
                }
              body:
                op: record
                fields:
                  source: { op: const, value: jwt+session }
                  caps:
                    {
                      op: call,
                      fn: merge,
                      args:
                        [
                          { op: get, path: $input/jwtResult/claims/caps },
                          { op: get, path: $input/sessionResult/ephemeral },
                        ],
                    }
                  capabilityScopes:
                    {
                      op: call,
                      fn: merge,
                      args:
                        [
                          { op: get, path: $input/jwtResult/claims/scopes },
                          { op: get, path: $input/sessionResult/capabilityScopes },
                        ],
                    }
                  jwtClaims: { op: get, path: $input/jwtResult/claims }
                  ephemeral: { op: get, path: $input/sessionResult/ephemeral }
            - pattern:
                {
                  kind: record,
                  fields:
                    {
                      jwtValid: { kind: const, value: false },
                      hasSession: { kind: const, value: true },
                    },
                }
              body:
                op: record
                fields:
                  source: { op: const, value: session }
                  caps: { op: get, path: $input/sessionResult/caps }
                  capabilityScopes: { op: get, path: $input/sessionResult/capabilityScopes }
                  ephemeral: { op: get, path: $input/sessionResult/ephemeral }
            - pattern:
                {
                  kind: record,
                  fields:
                    {
                      jwtValid: { kind: const, value: false },
                      hasSession: { kind: const, value: false },
                    },
                }
              body:
                op: record
                fields:
                  source: { op: const, value: anonymous }
                  caps: { op: const, value: {} }
                  capabilityScopes: { op: const, value: {} }
    category: pure
  resolveAuth:
    id: morphism://adk/resolveAuth/1.0
    input: type://adk/ResolveAuthInput/0.1.0
    output: type://adk/ResolvedAuth/0.1.0
    impl:
      kind: algebra
      ast:
        op: let
        name: $extracted
        value:
          op: apply
          fn: { op: var, name: $extractAuthHeader }
          arg:
            {
              op: record,
              fields:
                {
                  request: { op: get, path: $input/request },
                  authZPrimitives: { op: get, path: $input/context/authZPrimitives },
                },
            }
        body:
          op: let
          name: $jwtResult
          value:
            op: apply
            fn: { op: var, name: $jwtVerify }
            arg:
              {
                op: record,
                fields:
                  {
                    rawToken: { op: get, path: $extracted/rawToken },
                    keyAssetRef: { op: get, path: $input/context/keyAssetRef },
                  },
              }
          body:
            op: let
            name: $sessionResult
            value:
              op: apply
              fn: { op: var, name: $mergeSessionScopes }
              arg:
                {
                  op: record,
                  fields:
                    {
                      sessionIds: { op: get, path: $input/request/sessionIds },
                      declaredScopes: { op: get, path: $input/context/declaredScopes },
                      store: { op: get, path: $input/context/store },
                    },
                }
            body:
              op: apply
              fn: { op: var, name: $emitResolvedAuth }
              arg:
                {
                  op: record,
                  fields:
                    {
                      jwtResult: { op: var, name: $jwtResult },
                      sessionResult: { op: var, name: $sessionResult },
                      extracted: { op: var, name: $extracted },
                    },
                }
    category: stateful
  bindSession:
    id: morphism://adk/bindSession/1.0
    input: type://adk/BindSessionInput/0.1.0
    output: type://adk/SessionId/0.1.0
    impl:
      kind: algebra
      ast:
        op: let
        name: $sessionId
        value:
          op: apply
          fn: { op: var, name: $store }
          arg:
            {
              op: record,
              fields:
                {
                  op: { op: const, value: create },
                  user: { op: get, path: $input/user },
                  scope: { op: get, path: $input/scope },
                },
            }
        body:
          op: let
          name: $_
          value:
            op: apply
            fn: { op: var, name: $store }
            arg:
              {
                op: record,
                fields:
                  {
                    op: { op: const, value: attach },
                    sessionId: { op: var, name: $sessionId },
                    caps: { op: get, path: $input/caps },
                  },
              }
          body: { op: var, name: $sessionId }
    category: stateful
  jwtSign:
    id: morphism://adk/jwtSign/1.0
    input: type://adk/JwtSignInput/0.1.0
    output: type://adk/JwtToken/0.1.0
    impl:
      kind: algebra
      ast:
        op: let
        name: $signed
        value:
          op: apply
          fn: { op: var, name: $jwtVerifier }
          arg:
            op: record
            fields:
              op: { op: const, value: sign }
              claims: { op: get, path: $input/payload }
              keyRef: { op: get, path: $input/keyRef }
              verifierRef: { op: get, path: $input/verifierRef }
        body: { op: get, path: $signed/token }
    category: stateful
  deepMerge:
    id: morphism://adk/deepMerge/1.0
    input: type://adk/DeepMergeInput/0.1.0
    output: type://adk/DeepMergeResult/0.1.0
    category: pure
    impl:
      kind: algebra
      ast:
        op: apply
        fn: { op: var, name: "$composeMerge" }
        arg: { op: var, name: "$input" }
  resolveKindComposition:
    id: morphism://adk/resolveKindComposition/1.0
    input: type://adk/KindCompositionInput/0.1.0
    output: type://adk/MergedKind/0.1.0
    category: pure
    impl:
      kind: algebra
      ast:
        op: let
        name: "$afterDefaults"
        value:
          op: apply
          fn: { op: var, name: "$deepMerge" }
          arg:
            op: record
            fields:
              base: { op: get, path: "$input/defaults" }
              overlay: { op: get, path: "$input/projection" }
              opts:
                op: record
                fields:
                  allowUnknownPaths: { op: const, value: false }
        body:
          op: let
          name: "$afterInvariants"
          value:
            op: apply
            fn: { op: var, name: "$deepMerge" }
            arg:
              op: record
              fields:
                base: { op: var, name: "$afterDefaults" }
                overlay: { op: get, path: "$input/invariants" }
                opts:
                  op: record
                  fields:
                    allowUnknownPaths: { op: const, value: true }
          body:
            op: let
            name: "$overlap"
            value:
              op: apply
              fn: { op: var, name: "$findOverlap" }
              arg:
                op: record
                fields:
                  a: { op: get, path: "$input/projection" }
                  b: { op: get, path: "$input/invariants" }
            body:
              op: let
              name: "$warning"
              value:
                op: if
                cond:
                  op: call
                  fn: gt
                  args:
                    - { op: call, fn: length, args: [{ op: get, path: "$overlap/paths" }] }
                    - { op: const, value: 0 }
                then:
                  op: apply
                  fn: { op: var, name: "$recordWarning" }
                  arg:
                    op: record
                    fields:
                      overlap: { op: get, path: "$overlap/paths" }
                      context: { op: const, value: "kind-composition" }
                else: { op: const, value: {} }
              body: { op: var, name: "$afterInvariants" }
  detectExtendsCycle:
    id: morphism://adk/detectExtendsCycle/1.0
    input: type://adk/ExtendsChain/0.1.0
    output: type://adk/CycleDetection/0.1.0
    category: pure
    impl:
      kind: algebra
      ast:
        op: apply
        fn: { op: var, name: "$detectCycle" }
        arg: { op: var, name: "$input" }
  mergeExtendsChain:
    id: morphism://adk/mergeExtendsChain/1.0
    input: type://adk/ExtendsChain/0.1.0
    output: type://adk/ResolvedProjection/0.1.0
    category: pure
    impl:
      kind: algebra
      ast:
        op: let
        name: "$cycle"
        value:
          op: apply
          fn: { op: var, name: "$detectExtendsCycle" }
          arg: { op: var, name: "$input" }
        body:
          op: if
          cond: { op: get, path: "$cycle/hasCycle" }
          then:
            op: apply
            fn: { op: var, name: "$raiseExtendsCycle" }
            arg: { op: var, name: "$cycle" }
          else:
            op: apply
            fn: { op: var, name: "$mergeChain" }
            arg: { op: get, path: "$input/chain" }
  extendsResolver:
    id: morphism://adk/extendsResolver/1.0
    input: type://adk/ExtendsResolverInput/0.1.0
    output: type://adk/ResolvedProjection/0.1.0
    category: stateful
    impl:
      kind: algebra
      ast:
        op: let
        name: "$chain"
        value:
          op: apply
          fn: { op: var, name: "$buildChain" }
          arg:
            op: record
            fields:
              doc: { op: get, path: "$input/doc" }
              registry: { op: get, path: "$input/registry" }
        body:
          op: apply
          fn: { op: var, name: "$mergeExtendsChain" }
          arg:
            op: record
            fields:
              chain: { op: var, name: "$chain" }
  recordWarning:
    id: morphism://adk/recordWarning/1.0
    input: type://adk/WarningInput/0.1.0
    output: type://adk/UnitResult/0.1.0
    category: stateful
    impl:
      kind: algebra
      ast:
        op: apply
        fn: { op: var, name: "$emitEvent" }
        arg:
          op: record
          fields:
            level: { op: const, value: "warning" }
            overlap: { op: get, path: "$input/overlap" }
            context: { op: get, path: "$input/context" }

actions:
  Compile:
    name: Compile
    verb: compile
    inputSchema:
      type: object
      required: [yamlText]
      properties:
        yamlText: { type: string }
    capabilityRequirement: cap://none
    machine: EchoLifecycle
    morphism:
      kind: compose
      f:
        kind: name
        name: parseProjectionDoc
      g:
        kind: compose
        f:
          kind: name
          name: resolveExtends
        g:
          kind: compose
          f:
            kind: name
            name: buildManifest
          g:
            kind: compose
            f:
              kind: name
              name: walkAst
            g:
              kind: compose
              f:
                kind: name
                name: surveyDemand
              g:
                kind: name
                name: emitCompiled
  Echo:
    name: Echo
    verb: echo
    inputSchema:
      type: object
      required: [msg]
      properties:
        msg: { type: string }
    capabilityRequirement: cap://none
    machine: EchoLifecycle
    morphism:
      kind: compose
      f:
        kind: name
        name: upperCase
      g:
        kind: name
        name: measure
  SecureEcho:
    name: SecureEcho
    verb: echo
    inputSchema:
      type: object
      required: [msg]
      properties:
        msg: { type: string }
    capabilityRequirement: cap://@echo/secure-dispatch/0.1.0
    machine: EchoLifecycle
    morphism:
      kind: name
      name: guardedEcho
  Authorize:
    name: Authorize
    verb: authorize
    inputSchema:
      type: object
      required: [requires, session, scope, nodePath]
    capabilityRequirement: cap://none
    machine: EchoLifecycle # Reuse until DispatchLifecycle exists.
    morphism:
      kind: name
      name: authorize
  Dispatch:
    name: Dispatch
    verb: dispatch
    inputSchema:
      type: object
      required: [actionRef]
      properties:
        actionRef: { type: string }
        target: { type: string }
        payload: { type: object }
    capabilityRequirement: cap://@projection/dispatch/0.1.0
    machine: DispatchLifecycle
    morphism:
      kind: compose
      f:
        kind: name
        name: resolveRef
      g:
        kind: compose
        f:
          kind: name
          name: authorize
        g:
          kind: compose
          f:
            kind: name
            name: submitIntent
          g:
            kind: name
            name: encodeResult
  SurveyCapabilities:
    name: SurveyCapabilities
    verb: surveyCapabilities
    inputSchema:
      type: object
    capabilityRequirement: cap://none
    machine: EchoLifecycle
    morphism:
      kind: name
      name: surveyCapabilities
  Render:
    name: Render
    verb: render
    inputSchema:
      type: object
      required: [doc, pageName]
      properties:
        doc: { type: object }
        pageName: { type: string }
        props: { type: object }
    capabilityRequirement: cap://none
    machine: EchoLifecycle
    morphism:
      kind: name
      name: render

capabilities:
  SecureEchoDispatch:
    id: cap://@echo/secure-dispatch/0.1.0
  ProjectionDispatch:
    id: cap://@projection/dispatch/0.1.0

imports:
  - module://./L11-projection/morphisms/parse-projection-doc.ts#default
  - module://./L11-projection/morphisms/resolve-extends.ts#default
  - module://./L11-projection/morphisms/build-manifest.ts#default
  - module://./L11-projection/morphisms/evaluate-projection-morphism.ts#default
  - module://./L11-projection/morphisms/normalize-morphism-output.ts#default
  - module://./L11-projection/morphisms/materialize-projection-node.ts#default
  - module://./L11-projection/morphisms/resolve-binding.ts#default
  - module://./L11-projection/morphisms/walk-ast.ts#default
  - module://./L11-projection/morphisms/survey-demand.ts#default
  - module://./L11-projection/morphisms/emit-compiled.ts#default
  - module://./L11-projection/morphisms/upper-case.ts#default
  - module://./L11-projection/morphisms/measure.ts#default
  - module://./L11-projection/morphisms/guarded-echo.ts#default
  - module://./L11-projection/morphisms/lookup-cap.ts#default
  - module://./L11-projection/morphisms/verify-one.ts#default
  - module://./L11-projection/morphisms/resolve-ref.ts#default
  - module://./L11-projection/morphisms/submit-intent.ts#default
  - module://./L11-projection/morphisms/encode-result.ts#default
  - module://./L11-projection/morphisms/walk-projection-nodes.ts#default
  - module://./L11-projection/morphisms/render.ts#default
  - module://./L11-projection/morphisms/register-types.ts#default
  - module://./L11-projection/morphisms/register-machines.ts#default
  - module://./L11-projection/morphisms/register-morphisms.ts#default
  - module://./L11-projection/morphisms/register-actions.ts#default
  - module://./L11-projection/morphisms/install-kernel-model.ts#default

