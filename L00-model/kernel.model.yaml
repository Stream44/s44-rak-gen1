  JwtVerifyInput:
    name: JwtVerifyInput
    jsonSchema:
      type: object
      required: [rawToken, keyAssetRef]
      properties:
        rawToken: {}
        keyAssetRef: {}
      additionalProperties: true
  JwtVerifyResult:
    name: JwtVerifyResult
    jsonSchema:
      type: object
      required: [valid]
      properties:
        valid: { type: boolean }
        claims: { type: object }
        error: { type: string }
      additionalProperties: true
  MergeSessionScopesInput:
    name: MergeSessionScopesInput
    jsonSchema:
      type: object
      required: [sessionIds, declaredScopes]
      properties:
        sessionIds: { type: object }
        declaredScopes:
