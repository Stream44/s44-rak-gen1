  RegisterTypesInput:
    name: RegisterTypesInput
    jsonSchema:
      type: object
      properties: {}
      additionalProperties: true
  RegisterMachinesInput:
    name: RegisterMachinesInput
    jsonSchema:
      type: object
      properties: {}
      additionalProperties: true
  RegisterMorphismsInput:
    name: RegisterMorphismsInput
    jsonSchema:
      type: object
      properties: {}
      additionalProperties: true
  RegisterActionsInput:
    name: RegisterActionsInput
    jsonSchema:
      type: object
      properties: {}
      additionalProperties: true
  InstallKernelModelInput:
    name: InstallKernelModelInput
    jsonSchema:
      type: object
      properties: {}
      additionalProperties: true
  InstallKernelModelOutput:
    name: InstallKernelModelOutput
    jsonSchema:
      type: object
      properties: {}
      additionalProperties: true
  AuthExtractInput:
    name: AuthExtractInput
    jsonSchema:
      type: object
      required: [request, authZPrimitives]
      properties:
        request: { type: object }
        authZPrimitives:
          type: array
