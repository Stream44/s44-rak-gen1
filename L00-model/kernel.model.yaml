      additionalProperties: true
  AuthExtractResult:
    name: AuthExtractResult
    jsonSchema:
      type: object
      required: [rawToken, authHeader, caps, found]
      properties:
        rawToken: {}
        authHeader: {}
        caps: { type: object }
