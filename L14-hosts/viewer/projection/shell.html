<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>{{title}}</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:system-ui,-apple-system,sans-serif;background:#070712;color:#d0d0e0}
#root{padding:12px 16px 0}
.stack{display:flex;flex-direction:column;gap:10px;height:calc(100vh - 24px)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
button{background:#14142c;border:1px solid #2a2a4a;color:#8ac;padding:8px 18px;border-radius:6px;cursor:pointer;font-size:13px;font-family:inherit;transition:all 0.15s;font-weight:600;letter-spacing:0.5px}
button:hover{background:#1c1c3c;border-color:#4a4a8a;color:#acf}
button.active{background:#223060;border-color:#446aaa;color:#cde}
iframe{background:#0b0b1a;border-radius:6px 6px 0 0}
</style>
</head>
<body>
<div id="root">{{body}}</div>
<script>
(function(){
  var frame = document.querySelector("#root iframe");
  var buttons = document.querySelectorAll("#root button");

  function setActive(tab){
    buttons.forEach(function(b){
      var label = (b.textContent || "").toLowerCase();
      if ((tab === "model-world" && label.indexOf("model") >= 0) ||
          (tab === "observatory" && label.indexOf("observatory") >= 0) ||
          (tab === "projection" && label.indexOf("projection") >= 0)) {
        b.classList.add("active");
      } else {
        b.classList.remove("active");
      }
    });
  }

  window["__adkCustomAction"] = function(name, payload){
    if (name === "tab.select" && payload && payload.url) {
      if (frame) frame.src = payload.url;
      if (payload.tab) setActive(payload.tab);
    }
  };

  // Mark the initial iframe as active.
  setActive("model-world");
})();
</script>
<script>{{handlersJs}}</script>
</body>
</html>
