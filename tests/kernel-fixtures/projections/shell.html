<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>{{title}}</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0b0b1a;color:#d0d0e0;padding:24px;line-height:1.5}
#root{max-width:920px;margin:0 auto}
h1,h2,h3{color:#caf;letter-spacing:0.5px}
h1{font-size:22px;margin:0 0 16px;padding-bottom:10px;border-bottom:1px solid #2a2a4a}
section{background:#0f0f20;border:1px solid #2a2a4a;border-radius:6px;padding:16px;margin:16px 0}
section>header{font-size:11px;color:#86a;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #1a1a3a;font-weight:600}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card{background:#161630;border:1px solid #222244;border-radius:6px;padding:12px}
span{font-size:13px}
.badge{display:inline-block;padding:2px 8px;border-radius:3px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;background:#223366;color:#6af}
.badge[data-tone=info]{background:#1a2a3a;color:#6af}
button{background:#2a1a3a;border:1px solid #4a2a6a;color:#caf;padding:6px 14px;border-radius:4px;cursor:pointer;font-size:12px;font-family:inherit}
button:hover:not([disabled]){background:#4a2a6a}
button[disabled]{opacity:0.3;cursor:not-allowed}
</style>
</head>
<body>
<div id="root">{{body}}</div>
<script>{{handlersJs}}</script>
</body>
</html>
