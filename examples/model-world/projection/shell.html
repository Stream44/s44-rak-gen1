<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>{{title}}</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0b0b1a;color:#d0d0e0;padding:24px;line-height:1.5}
#root{max-width:920px;margin:0 auto}
h1,h2,h3,h4{color:#8ac;letter-spacing:0.5px}
h1{font-size:22px;margin:0 0 16px;padding-bottom:10px;border-bottom:1px solid #2a2a4a}
section{background:#0f0f20;border:1px solid #2a2a4a;border-radius:6px;padding:16px;margin:16px 0}
section>header{font-size:11px;color:#669;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #1a1a3a;font-weight:600}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.column{display:flex;flex-direction:column;gap:10px}
.grid{display:grid;gap:10px}
.card{background:#161630;border:1px solid #222244;border-radius:6px;padding:12px}
.card .row{margin:4px 0}
span{font-size:13px}
.badge{display:inline-block;padding:2px 8px;border-radius:3px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;background:#223366;color:#6af}
.badge[data-tone=success]{background:#1a3a1a;color:#8f8}
.badge[data-tone=warn]{background:#3a2a1a;color:#fa6}
.badge[data-tone=error]{background:#3a1a1a;color:#f88}
.badge[data-tone=info]{background:#1a2a3a;color:#6af}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#444;margin-right:4px}
.status-dot[data-status=on],.status-dot[data-status=active]{background:#4c4}
button{background:#1a2a1a;border:1px solid #2a4a2a;color:#8c8;padding:6px 14px;border-radius:4px;cursor:pointer;font-size:12px;font-family:inherit;transition:all 0.15s}
button:hover:not([disabled]){background:#2a4a2a;border-color:#4a8a4a;color:#afa}
button[disabled]{opacity:0.3;cursor:not-allowed}
#log{max-width:920px;margin:20px auto 0}
.err{color:#f88;background:#1a0a0a;border:1px solid #3a1a1a;padding:8px 12px;border-radius:4px;margin:6px 0;font-size:12px;font-family:monospace}
#conn{position:fixed;top:16px;right:20px;font-size:11px;color:#668}
#conn .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;background:#c44}
#conn.on .dot{background:#4c4}
</style>
</head>
<body>
<div id="conn"><span class="dot"></span><span id="conn-lbl">offline</span></div>
<div id="root">{{body}}</div>
<div id="log"></div>
<script>
(function(){
  var mount = "{{mount}}";
  var root = document.getElementById("root");
  var log = document.getElementById("log");
  var conn = document.getElementById("conn");
  var connLbl = document.getElementById("conn-lbl");

  function connect(){
    window.ws = new WebSocket("ws://" + location.host + mount + "/ws");
    window.ws.onopen = function(){ conn.className = "on"; connLbl.textContent = "live"; };
    window.ws.onclose = function(){
      conn.className = ""; connLbl.textContent = "offline";
      setTimeout(connect, 1000);
    };
    window.ws.onmessage = function(e){
      var f = JSON.parse(e.data);
      if (f.type === "rerender") {
        root.innerHTML = f.html;
        runHandlers(f.handlersJs);
      } else if (f.type === "error") {
        log.innerHTML = '<div class="err">' + escapeHtml(f.message) + '</div>' + log.innerHTML;
      }
    };
  }
  function runHandlers(js){ try { new Function(js)(); } catch (e) { console.error("handler error:", e); } }
  function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  connect();
})();
</script>
<script>{{handlersJs}}</script>
</body>
</html>
