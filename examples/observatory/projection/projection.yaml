                        children:
                          - component: Inspector
                            props:
                              kind: acceptanceStep
                              selected: "$bind.runtime.panels.selectedAcceptance"
                              emptyState: "Select a step or instance to inspect."
                  - component: Stack
                    props: { class: suite-catalogue }
                    children:
                      - component: Heading
                        props: { level: 3, text: "Suite · $bind.playback.suite.name" }
                      - op: iter
                        for: "$bind.playback.suite.useCases"
                        as: useCase
                        emptyFallback:
                          op: literal
                          value:
                            component: EmptyState
                            props: { message: "No acceptance use cases loaded." }
                        template:
                          component: Card
                          props: { class: acceptance-use-case, data-use-case-id: "$useCase.id", data-suite-node-count: "$bind.playback.suite.nodes.length" }
                          children:
                            - component: Heading
                              props: { level: 4, text: "$useCase.name" }
                            - op: iter
                              for: "$useCase.scenarios"
                              as: scenario
                              template:
                                component: Row
                                props: { class: scenario-row, data-scenario-id: "$scenario.id" }
                                children:
                                  - component: Text
                                    props: { text: "$scenario.name" }
                                  - if: { eq: ["$scenario.traceCount", 1] }
                                    then:
                                      component: Button
                                      props: { label: "▶ Play", data-acceptance-trace-play: true }
                                      onClick: { action: acceptance.play, payload: { scenarioId: "$scenario.id", traceIndex: 0 } }
                                    else:
                                      - op: iter
                                        for: "$scenario.traceButtons"
                                        as: traceButton
                                        template:
                                          component: Button
                                          props: { label: "$traceButton.label", data-acceptance-trace-play: true }
                                          onClick: { action: acceptance.play, payload: { scenarioId: "$traceButton.scenarioId", traceIndex: "$traceButton.traceIndex" } }
          - use: modelWorldPanel
  model-world-v2:
    children:
      - component: Context
        props:
          scope: page
          initial: { activeTab: reflective }
        children:
          - use: modelWorldPanel
