            children:
              - component: Toolbar
                props: { class: acceptance-toolbar }
                children:
                  - component: Heading
                    props: { level: 2, text: Acceptance }
                  - component: Select
                    props:
                      class: suite-selector
                      actionRef: acceptance.loadSuite
                      payloadKey: suiteId
                      value: { op: first, of: { op: filter, of: "$bind.playback.suites", predicate: { field: active, equals: true } }, field: id }
                      options:
                        op: map
                        of: "$bind.playback.suites"
                        to: { value: "$item.id", label: "$item.name" }
                    onChange: { action: acceptance.loadSuite, payload: { suiteId: "$event.value" } }
                  - component: Pill
                    props:
                      label: "$bind.playback.session.status"
                      tone:
                        op: lookup
                        of: "$bind.playback.session.status"
                        map: { passed: success, failed: error, stepPassed: success, stepFailed: error, stepError: warning, ended: success, idle: neutral, playing: info, paused: neutral }
                      data-session-status: "$bind.playback.session.status"
                  - component: Button
                    props: { label: "▶ Play", data-session-action: play, disabled: { eq: ["$bind.playback.session.status", idle] } }
                    onClick: { action: acceptance.resume }
                  - component: Button
                    props: { label: "⏸ Pause", data-session-action: pause }
                    onClick: { action: acceptance.pause }
                  - component: Button
                    props: { label: "Next ⟶", data-session-action: next }
                    onClick: { action: acceptance.stepForward }
                  - component: Button
                    props: { label: "⟵ Back", data-session-action: back }
                    onClick: { action: acceptance.stepBack }
                  - component: Button
                    props: { label: "↻ Reset", data-session-action: reset }
                    onClick: { action: acceptance.reset }
